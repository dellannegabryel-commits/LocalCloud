server {
    listen 80;
    server_name localhost;

    # Disable upload limits for personal use
    client_max_body_size 0;

    # Increase timeouts for massive file transfers
    proxy_connect_timeout 3600s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    send_timeout          3600s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ensure timeout settings are applied to the proxy location
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Handle file downloads and previews through proxy
    location /download/ {
        proxy_pass http://backend:4000/download/;
        proxy_read_timeout 3600s;
    }

    location /view/ {
        proxy_pass http://backend:4000/view/;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
